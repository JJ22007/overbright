name: macOS checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/package_release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Overbright-universal
          path: outputs/Overbright-universal.zip

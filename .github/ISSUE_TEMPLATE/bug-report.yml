name: Bug report
description: Something doesn't work as the README says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For a Mac model that hasn't been checked yet, the model report is more useful. For a security problem, use the private report on the Security tab instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Turn the boost on at 150%
        2. Close the lid
        3. ...
  - type: input
    id: version
    attributes:
      label: Overbright version
      description: "Run `overbright version`."
      placeholder: "2.6.2"
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model identifier and macOS version
      description: "Run `sysctl -n hw.model; sw_vers -productVersion`."
      placeholder: MacBookPro18,1, 27.2
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Output of `overbright status --json`
      description: Run it while the problem is happening, if you can.
      render: json
  - type: textarea
    id: config
    attributes:
      label: Your config
      description: "`~/.config/overbright/config.json`, if you changed it."
      render: json
